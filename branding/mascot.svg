<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440">
  <!-- Vitrum mascot — traced from Raiden's hand-drawn sketch, 2026-10-14 -->
  <!-- surfboard -->
  <polygon points="52,374 344,352 332,394 44,414" fill="#2FA84F"/>
  <!-- legs -->
  <rect x="162" y="302" width="26" height="46" fill="#FFD21F"/>
  <rect x="212" y="302" width="26" height="46" fill="#FFD21F"/>
  <!-- swim trunks -->
  <rect x="138" y="224" width="124" height="84" rx="26" fill="#F68B1F"/>
  <!-- V outline -->
  <g stroke="#161616" stroke-width="46" stroke-linecap="round" fill="none">
    <path d="M148,78 L208,238"/>
    <path d="M268,78 L208,238"/>
  </g>
  <!-- V -->
  <g stroke="#FFD21F" stroke-width="42" stroke-linecap="round" fill="none">
    <path d="M140,72 L200,232"/>
    <path d="M260,72 L200,232"/>
  </g>
  <!-- arms -->
  <path d="M158,200 q-26,12 -48,-4 q-12,-10 -26,-4" stroke="#161616" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M242,200 q26,12 48,-4 q12,-10 26,-4" stroke="#161616" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- sunglasses -->
  <ellipse cx="160" cy="122" rx="42" ry="30" fill="#111111"/>
  <ellipse cx="244" cy="122" rx="42" ry="30" fill="#111111"/>
  <rect x="198" y="114" width="12" height="14" fill="#111111"/>
</svg>
