<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560">
  <!-- Vitrum mascot v3 — cleaned-up vector, Raiden's design, 2026-10-14 -->
  <!-- sun -->
  <circle cx="402" cy="66" r="32" fill="#FCD34D"/>
  <!-- back wave -->
  <path d="M0,470 C70,430 140,420 210,432 C290,446 360,420 480,455 L480,560 L0,560 Z" fill="#0D9488"/>
  <!-- foam crest -->
  <path d="M0,470 C70,430 140,420 210,432 C290,446 360,420 480,455" stroke="#FFFFFF" stroke-width="24" fill="none" stroke-linecap="round"/>
  <!-- front wave -->
  <path d="M0,498 C80,468 170,462 250,474 C330,486 400,468 480,492 L480,560 L0,560 Z" fill="#2DD4BF" opacity="0.9"/>
  <!-- surfboard -->
  <g transform="rotate(-4 240 445)">
    <rect x="110" y="432" width="260" height="26" rx="13" fill="#22C55E"/>
  </g>
  <!-- legs -->
  <rect x="214" y="368" width="24" height="62" fill="#FFD21F"/>
  <rect x="258" y="368" width="24" height="62" fill="#FFD21F"/>
  <!-- swim trunks -->
  <rect x="183" y="300" width="114" height="78" rx="24" fill="#F68B1F"/>
  <!-- V outline -->
  <g stroke="#161616" stroke-width="44" stroke-linecap="round" fill="none">
    <path d="M197,75 L252,335"/>
    <path d="M297,75 L252,335"/>
  </g>
  <!-- V -->
  <g stroke="#FFD21F" stroke-width="40" stroke-linecap="round" fill="none">
    <path d="M190,70 L245,330"/>
    <path d="M290,70 L245,330"/>
  </g>
  <!-- arms -->
  <path d="M202,210 q-24,10 -44,-2 q-12,-8 -24,-2" stroke="#161616" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M278,210 q24,10 44,-2 q12,-8 24,-2" stroke="#161616" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- sunglasses -->
  <ellipse cx="203" cy="130" rx="40" ry="28" fill="#111111"/>
  <ellipse cx="277" cy="130" rx="40" ry="28" fill="#111111"/>
  <rect x="239" y="122" width="10" height="14" fill="#111111"/>
</svg>
