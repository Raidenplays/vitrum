name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: 'qtwayland'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build extra-cmake-modules \
            libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Build layer-shell-qt
        run: |
          git clone --depth 1 https://invent.kde.org/plasma/layer-shell-qt.git
          cmake -S layer-shell-qt -B build-lsq \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release
          cmake --build build-lsq
          sudo cmake --install build-lsq

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build
